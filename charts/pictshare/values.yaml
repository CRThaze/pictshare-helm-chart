# -- Number of replicas.
replicaCount: 1

additionalVolumeMounts: []

additionalVolumes: []

affinity: {}

autoscaling:
  enabled: false
  maxReplicas: 100
  minReplicas: 1
  targetCPUUtilizationPercentage: 80

fullnameOverride: ""

image:
  # -- Image Pull Policy.
  pullPolicy: IfNotPresent
  # -- Image Registry (empty uses the runtime's default, Docker Hub).
  registry: ""
  # -- Image Repository.
  repository: hascheksolutions/pictshare
  # -- Image Tag.
  # @default -- Uses `.Chart.appVersion`
  tag:

imagePullSecrets: []

# -- Base URL PictShare puts in upload responses; must end with `/`.
# @default -- `http://<first ingress host>/`
url: ""

# -- Extra container env. PictShare 3 builds its config from env on every start; see
# https://github.com/HaschekSolutions/pictshare/blob/master/rtfm/CONFIG.md
env: []

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

nameOverride: ""

nodeSelector: {}

persistence:
  data:
    # -- Storage PVC Access Modes.
    accessModes:
      - ReadWriteMany
    resources:
      requests:
        # -- Storage PVC Size.
        storage: 1Gi
    # -- Storage Class to use for uploads storage.
    storageClassName:

podAnnotations: {}

podLabels: {}

podSecurityContext: {}

resources: {}

securityContext: {}

service:
  port: 80
  # -- Service Type.
  type: ClusterIP

serviceAccount:
  annotations: {}
  automount: true
  create: false
  name: ""

tolerations: []

ingress:
  # -- Whether to use an Ingress for application access.
  enabled: false
  # annotations: {}
  # className: nginx
  hosts: []
  tls: []

uploadIngress:
  # -- Whether to use a separate Ingress for uploading. PictShare 3 takes writes on `/api`,
  # `/mcp` and `/report`; the upload form itself is at `/`.
  enabled: false
  annotations: {}
  # className: nginx
  hosts: []
  tls: []
